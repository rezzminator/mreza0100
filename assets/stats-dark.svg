<svg xmlns="http://www.w3.org/2000/svg" width="495" height="212" viewBox="0 0 495 212" role="img" aria-labelledby="card-title">
  <title id="card-title">GitHub at a glance: 184 stars, 26 public repos, 1,052 contributions in the last 12 months, 1,541 all-time, 72 followers. Top languages: Go 59.3%, TypeScript 16.5%, JavaScript 10.4%, Python 5.0%, Rust 5.0%, HTML 3.9%.</title>
  <style>
    .card { fill: #1a1b26; stroke: #2f3549; stroke-width: 1; }
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #c0caf5; }
    .title { font-size: 18px; font-weight: 600; fill: #7aa2f7; }
    .label { font-size: 12px; }
    .num { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12px; font-weight: 600; fill: #e0af68; }
    .section { font-size: 12px; font-weight: 600; }
    .legend { font-size: 11px; }
    .pct { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10px; fill: #565f89; }
    .empty { font-size: 11px; fill: #565f89; }
    .icon { fill: none; stroke: #7dcfff; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .track { fill: #24283b; }
    /* Rows start visible and the keyframes only add motion, so a renderer that ignores
       CSS animation (or shows a static frame) still displays the finished card. */
    .row { animation: rise 0.45s ease-out both; }
    .seg { transform-box: fill-box; transform-origin: left center;
           animation: grow 0.80s cubic-bezier(.25, .8, .25, 1) both; }
    @keyframes rise { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .row, .seg { animation: none; } }
  </style>
  <defs>
    <clipPath id="bar-clip"><rect x="264" y="88" width="211" height="8" rx="4"/></clipPath>
  </defs>
  <rect class="card" x="0.5" y="0.5" width="494" height="211" rx="10"/>
  <text class="title" x="20" y="35">GitHub at a glance</text>
  <g class="row" style="animation-delay:0.15s">
    <g class="icon" transform="translate(20 58)"><path d="M8 1.8L9.7 6.05 14.28 6.36 10.76 9.3 11.88 13.74 8 11.3 4.12 13.74 5.24 9.3 1.72 6.36 6.3 6.05z"/></g>
    <text class="label" x="44" y="70">Total stars</text>
    <text class="num" x="246" y="70" text-anchor="end">184</text>
  </g>
  <g class="row" style="animation-delay:0.35s">
    <g class="icon" transform="translate(20 86)"><path d="M4.5 1.5h8v10.2H5a1.5 1.5 0 0 0 0 3h7.5M4.5 1.5a1 1 0 0 0-1 1V13M6.5 4.5h4"/></g>
    <text class="label" x="44" y="98">Public repos</text>
    <text class="num" x="246" y="98" text-anchor="end">26</text>
  </g>
  <g class="row" style="animation-delay:0.55s">
    <g class="icon" transform="translate(20 114)"><path d="M1.5 8h3.7M10.8 8h3.7M8 5.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6z"/></g>
    <text class="label" x="44" y="126">Contributions, last 12 months</text>
    <text class="num" x="246" y="126" text-anchor="end">1,052</text>
  </g>
  <g class="row" style="animation-delay:0.75s">
    <g class="icon" transform="translate(20 142)"><path d="M1.5 14.5h13M4.5 12V8M8 12V3.5M11.5 12V6"/></g>
    <text class="label" x="44" y="154">Contributions, all-time</text>
    <text class="num" x="246" y="154" text-anchor="end">1,541</text>
  </g>
  <g class="row" style="animation-delay:0.95s">
    <g class="icon" transform="translate(20 170)"><path d="M5.5 2.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM1.5 13.5a4 4 0 0 1 8 0M10.5 3a2.2 2.2 0 0 1 0 4.2M12.2 9.6a3.6 3.6 0 0 1 2.3 3.9"/></g>
    <text class="label" x="44" y="182">Followers</text>
    <text class="num" x="246" y="182" text-anchor="end">72</text>
  </g>
  <g class="row" style="animation-delay:0.15s">
    <g class="icon" transform="translate(264 58)"><path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5M9.5 2.5l-3 11"/></g>
    <text class="section" x="288" y="70">Top languages</text>
  </g>
  <rect class="track" x="264" y="88" width="211" height="8" rx="4"/>
  <g clip-path="url(#bar-clip)">
    <rect class="seg" x="264.00" y="88" width="125.61" height="8" fill="#00ADD8" style="animation-delay:0.35s"/>
    <rect class="seg" x="389.11" y="88" width="35.23" height="8" fill="#3178c6" style="animation-delay:0.41s"/>
    <rect class="seg" x="423.84" y="88" width="22.36" height="8" fill="#f1e05a" style="animation-delay:0.47s"/>
    <rect class="seg" x="445.71" y="88" width="11.00" height="8" fill="#3572A5" style="animation-delay:0.53s"/>
    <rect class="seg" x="456.21" y="88" width="10.96" height="8" fill="#dea584" style="animation-delay:0.59s"/>
    <rect class="seg" x="466.67" y="88" width="8.33" height="8" fill="#e34c26" style="animation-delay:0.65s"/>
  </g>
  <g class="row" style="animation-delay:0.55s">
    <circle cx="267.5" cy="122.5" r="3.5" fill="#00ADD8"/>
    <text class="legend" x="275" y="126">Go<tspan class="pct" dx="4">59.3%</tspan></text>
  </g>
  <g class="row" style="animation-delay:0.55s">
    <circle cx="377" cy="122.5" r="3.5" fill="#3178c6"/>
    <text class="legend" x="384.5" y="126">TypeScript<tspan class="pct" dx="4">16.5%</tspan></text>
  </g>
  <g class="row" style="animation-delay:0.75s">
    <circle cx="267.5" cy="150.5" r="3.5" fill="#f1e05a"/>
    <text class="legend" x="275" y="154">JavaScript<tspan class="pct" dx="4">10.4%</tspan></text>
  </g>
  <g class="row" style="animation-delay:0.75s">
    <circle cx="377" cy="150.5" r="3.5" fill="#3572A5"/>
    <text class="legend" x="384.5" y="154">Python<tspan class="pct" dx="4">5.0%</tspan></text>
  </g>
  <g class="row" style="animation-delay:0.95s">
    <circle cx="267.5" cy="178.5" r="3.5" fill="#dea584"/>
    <text class="legend" x="275" y="182">Rust<tspan class="pct" dx="4">5.0%</tspan></text>
  </g>
  <g class="row" style="animation-delay:0.95s">
    <circle cx="377" cy="178.5" r="3.5" fill="#e34c26"/>
    <text class="legend" x="384.5" y="182">HTML<tspan class="pct" dx="4">3.9%</tspan></text>
